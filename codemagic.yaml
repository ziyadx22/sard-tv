workflows:
  ios-ipa-build:
    name: Build MySard iOS IPA
    max_build_duration: 20
    instance_type: mac_mini_m2
    scripts:
      - name: Prepare & Build Unsigned IPA
        script: |
          set -e
          flutter create --platforms=ios --org=com.ziyad.mysard mysard_ios
          cd mysard_ios
          flutter pub add http
          cp ../ios_app.dart lib/main.dart
          flutter build ios --release --no-codesign --config-only
          cd ios
          pod install
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=build_out
          mkdir -p ../../Payload
          cp -r build_out/Runner.app ../../Payload/
          cd ../..
          zip -r MySard_iOS.ipa Payload
    artifacts:
      - MySard_iOS.ipa
