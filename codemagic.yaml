workflows:
  ios-ipa-build:
    name: Build MySard iOS IPA
    max_build_duration: 20
    instance_type: mac_mini_m2
    scripts:
      - name: Prepare & Build Unsigned IPA
        script: |
          set -e
          flutter create --platforms=ios --org=com.ziyad.mysard mysard_ios
          cd mysard_ios
          flutter pub add http mobile_scanner speech_to_text translator
          cp ../ios_app.dart lib/main.dart
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'نحتاج الكاميرا لمسح باركود التلفزيون'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'نحتاج المايكروفون لسماع الصوت وترجمته للتلفزيون'" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string 'نحتاج التعرف على الكلام للترجمة الفورية'" ios/Runner/Info.plist
          flutter build ios --release --no-codesign --config-only
          cd ios
          xcodebuild -project Runner.xcodeproj -scheme Runner -configuration Release -sdk iphoneos build CODE_SIGN_IDENTITY="" CODE_SIGN_REQUIRED=NO CODE_SIGN_ALLOWED=NO CONFIGURATION_BUILD_DIR=build_out
          mkdir -p ../../Payload
          cp -r build_out/Runner.app ../../Payload/
          cd ../..
          zip -r MySard_iOS.ipa Payload
    artifacts:
      - MySard_iOS.ipa
