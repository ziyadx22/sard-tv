name: Build MySard TV APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create & Build TV App
        run: |
          flutter create --platforms=android --org=com.ziyad.mysard mysard_tv
          cd mysard_tv
          flutter pub add qr_flutter google_fonts flutter_overlay_window
          cp ../main.dart lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"\/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/><uses-feature android:name="android.software.leanback" android:required="false"\/><uses-feature android:name="android.hardware.touchscreen" android:required="false"\/><application android:banner="@mipmap\/ic_launcher" android:label="MySard TV"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<category android:name="android.intent.category.LAUNCHER"\/>/<category android:name="android.intent.category.LAUNCHER"\/><category android:name="android.intent.category.LEANBACK_LAUNCHER"\/>/g' android/app/src/main/AndroidManifest.xml
          flutter build apk --release
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: mysard_tv/build/app/outputs/flutter-apk/app-release.apk
