name: Build MySard TV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create TV App
        run: |
          flutter create --platforms=android --org=com.ziyad.mysard mysard_tv
          cd mysard_tv
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\"/>\n    "
          open(p, "w").write(s.replace("<application", perms + "<application", 1))
          '
          flutter pub add http google_fonts flutter_overlay_window
          cp ../main.dart lib/main.dart
      - name: Build Universal APK
        run: |
          cd mysard_tv
          flutter build apk --release --target-platform android-arm,android-arm64
      - name: Publish Direct Link
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0
          files: mysard_tv/build/app/outputs/flutter-apk/app-release.apk
