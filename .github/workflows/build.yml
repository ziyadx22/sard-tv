name: Build MySard TV APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create & Build TV App
        run: |
          flutter create --platforms=android --org=com.ziyad.mysard mysard_tv
          cd mysard_tv
          flutter pub add http google_fonts
          cp ../main.dart lib/main.dart
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = """<uses-permission android:name="android.permission.INTERNET"/>
          <uses-feature android:name="android.software.leanback" android:required="false"/>
          <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>"""
          s = s.replace("<application", perms + "\n    <application android:banner=\"@mipmap/ic_launcher\" android:label=\"MySard TV\"")
          s = s.replace("<category android:name=\"android.intent.category.LAUNCHER\"/>", "<category android:name=\"android.intent.category.LAUNCHER\"/><category android:name=\"android.intent.category.LEANBACK_LAUNCHER\"/>")
          open(p, "w").write(s)
          '
          flutter build apk --release
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: mysard_tv/build/app/outputs/flutter-apk/app-release.apk
