name: Build MySard TV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create TV App
        run: |
          flutter create --platforms=android --org=com.ziyad.mysard mysard_tv
          cd mysard_tv
          flutter pub add http google_fonts qr_flutter
          if [ -f ../main.dart ]; then cp ../main.dart lib/main.dart; fi
      - name: Build APK
        run: |
          cd mysard_tv
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: MySard-TV-APK
          path: mysard_tv/build/app/outputs/flutter-apk/app-release.apk
