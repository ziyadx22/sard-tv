name: Build MySard iOS IPA
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create & Build iOS IPA
        run: |
          flutter create --platforms=ios --org=com.ziyad.mysard mysard_ios
          cd mysard_ios
          flutter pub add http
          cp ../ios_app.dart lib/main.dart
          flutter build ios --release --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -archivePath build/ios/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/ios/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r MySard_iOS.ipa Payload
      - name: Publish iOS IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0
          files: mysard_ios/MySard_iOS.ipa
